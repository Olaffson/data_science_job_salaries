name: CI

on:
  push:
    branches:
      - '**'  # S'exécute sur n'importe quelle branche (y compris celles contenant un '/')
  pull_request:
  workflow_dispatch:  # Permet de déclencher manuellement le workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m venv venv
        . venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pycodestyle bandit

    # Les tests utilisent leurs propres valeurs de SECRET_KEY / ADMIN_PASSWORD (voir api/test/test_api.py)
    - name: Run tests with coverage
      run: |
        . venv/bin/activate
        python -m pytest --cov=api api/

    - name: Run pycodestyle
      run: |
        . venv/bin/activate
        pycodestyle --statistics --ignore=E501,E712 api

    - name: Run bandit
      run: |
        . venv/bin/activate
        bandit -r api/ --exclude api/test
